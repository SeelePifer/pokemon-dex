spring:
  datasource:
    url: jdbc:h2:mem:pokemondex;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    locale: en
    locale-resolver: fixed

pokemondex:
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    parallelism: 1
  jwt:
    secret: test-secret-key-must-be-at-least-32-bytes
    expiration-minutes: 60
